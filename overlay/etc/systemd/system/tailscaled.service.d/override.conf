[Unit]
After=appliance-bootstrap.service time-sync.target
Wants=time-sync.target

[Service]
StateDirectory=
ExecStartPre=/bin/mkdir -p /persist/tailscale
ExecStart=
ExecStart=/usr/sbin/tailscaled --state=/persist/tailscale/tailscaled.state --socket=/run/tailscale/tailscaled.sock --port=41641
Restart=on-failure
RestartSec=5
