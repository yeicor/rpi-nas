name: Build & Test Appliance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Verify Image (Raspberry Pi 4)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU / binfmt
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,arm

      - name: Cache base images
        uses: actions/cache@v4
        with:
          path: .cache
          key: rpi-base-image-${{ hashFiles('build.sh') }}
          restore-keys: |
            rpi-base-image-

      - name: Run E2E Test Suite
        run: ./test/e2e-test.sh

      - name: Upload Deployable SD Card Image
        uses: actions/upload-artifact@v4
        with:
          name: rpi4-sd-image
          path: result/rpi4.img.zst
          if-no-files-found: error
          retention-days: 14
