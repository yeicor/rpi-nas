name: Build & Test Appliance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Verify Image (${{ matrix.device }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        device: [rpi4, rpi0w]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU / binfmt
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,arm

      - name: Cache base images
        uses: actions/cache@v4
        with:
          path: .cache
          key: rpi-base-image-${{ matrix.device }}-${{ hashFiles('build.sh') }}
          restore-keys: |
            rpi-base-image-${{ matrix.device }}-
            rpi-base-image-

      - name: Run E2E Test Suite
        run: ./test/e2e-test.sh ${{ matrix.device }}

      - name: Upload Deployable SD Card Image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.device }}-sd-image
          path: result/${{ matrix.device }}.img.zst
          if-no-files-found: error
          retention-days: 14
